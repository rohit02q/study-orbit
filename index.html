<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Orbit — Everything Around Your Progress</title>
<meta name="description" content="Study Orbit — Everything Around Your Progress. Track study sessions, analytics, tasks, notes, sleep, and focus music, all in one place." />
<meta name="theme-color" content="#0E1116" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="apple-touch-icon" href="assets/logo.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Study Orbit" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- Open Graph / social preview -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Study Orbit — Everything Around Your Progress" />
<meta property="og:description" content="Track study sessions, analytics, tasks, notes, sleep, and focus music, all in one place." />
<meta property="og:image" content="assets/logo.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Study Orbit — Everything Around Your Progress" />
<meta name="twitter:description" content="Track study sessions, analytics, tasks, notes, sleep, and focus music, all in one place." />
<meta name="twitter:image" content="assets/logo.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Utility layer only — the design system itself lives in tokens.css / style.css.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0E1116',
          surface: '#161A22',
          surfaceRaised: '#1E2530',
          border: '#262D3A',
          ember: '#F0A857',
          signal: '#63D2C4',
          danger: '#E8615F',
          warning: '#D9C548',
        },
      },
    },
  };
</script>

<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Primary navigation"></aside>
  <div class="drawer-scrim" id="drawer-scrim"></div>

  <div class="main-area">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap: 12px;">
        <button class="drawer-toggle" id="drawer-toggle" aria-label="Open navigation">
          <i data-lucide="menu"></i>
        </button>
        <h1 class="topbar-title" id="topbar-title">Dashboard</h1>
      </div>
    </header>

    <main class="page-content" id="main-content" role="main"></main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        /* PWA install just won't be available — the app still works normally without it */
      });
    });
  }
</script>
</body>
</html>
